<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dastic Launcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #e0e0e0;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      font-size: 2rem;
    }
    .header h1 {
      color: #00ff88;
      font-size: 1.6rem;
    }
    .header p {
      color: #666;
      font-size: 0.85rem;
    }
    .donate-btn {
      background: #1a2332;
      color: #ffaa00;
      border: 1px solid #ffaa0044;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .donate-btn:hover {
      background: #ffaa0011;
      border-color: #ffaa0088;
    }

    .wallet-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .wallet-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s;
    }
    .wallet-card:hover {
      border-color: #00ff8844;
    }
    .wallet-card.mining {
      border-color: #00ff8866;
      background: #0f1f17;
    }

    .wallet-info {
      flex: 1;
    }
    .wallet-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .wallet-name .avatar {
      font-size: 1.4rem;
    }
    .wallet-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
    }
    .status-dot.mining {
      background: #00ff88;
      box-shadow: 0 0 6px #00ff88;
    }
    .wallet-stats {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: #aaa;
    }
    .wallet-stats span {
      color: #00ff88;
      font-weight: 600;
    }
    .wallet-balance {
      color: #00ff88 !important;
      font-size: 0.95rem;
    }

    .wallet-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn {
      padding: 10px 22px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-launch {
      background: #00ff88;
      color: #000;
    }
    .btn-launch:hover {
      background: #00cc6a;
    }
    .btn-stop {
      background: #ff4444;
      color: #fff;
    }
    .btn-stop:hover {
      background: #cc3333;
    }
    .btn-delete {
      background: transparent;
      color: #666;
      border: 1px solid #333;
      padding: 10px 14px;
      font-size: 1rem;
    }
    .btn-delete:hover {
      color: #ff4444;
      border-color: #ff4444;
    }
    .btn-hidden {
      display: none !important;
    }

    .add-wallet {
      margin-top: 18px;
      display: flex;
      gap: 10px;
    }
    .add-wallet input {
      flex: 1;
      background: #111827;
      border: 1px solid #1f2937;
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 1rem;
    }
    .add-wallet input:focus {
      outline: none;
      border-color: #00ff88;
    }
    .btn-add {
      background: #1a2332;
      color: #00ff88;
      border: 1px solid #00ff8844;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-add:hover {
      background: #00ff8811;
    }

    /* Donation Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 28px;
      width: 420px;
      max-width: 90%;
    }
    .modal h3 {
      color: #ffaa00;
      margin-bottom: 12px;
      font-size: 1.2rem;
    }
    .modal p {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .wallet-address {
      background: #0b0f19;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #00ff88;
      word-break: break-all;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .wallet-address:hover {
      border-color: #00ff88;
    }
    .modal .close-btn {
      background: #1f2937;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    .modal .close-btn:hover {
      background: #374151;
    }
    .copied {
      color: #00ff88;
      font-size: 0.8rem;
      text-align: center;
      margin-bottom: 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .copied.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo">🐝</div>
      <div>
        <h1>Dastic</h1>
        <p data-i18n="app.tagline">Multi-wallet NACKL miner</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <select id="languageSelect" title="Language"
              style="background:#111827;color:#9ca3af;border:1px solid #1f2937;border-radius:6px;padding:5px 8px;font-size:0.82rem;"></select>
      <button class="donate-btn" id="donateBtn" style="display:none;" onclick="showDonate()" data-i18n="launcher.donate">☕ Buy martins a coffee</button>
    </div>
  </div>

  <div class="wallet-list" id="walletList"></div>

  <div class="add-wallet" id="addWalletSection">
    <input type="text" id="newWalletName" placeholder="Enter wallet name..." data-i18n-placeholder="launcher.walletNamePlaceholder" maxlength="20">
    <button class="btn-add" onclick="addWallet()" data-i18n="launcher.addWallet">+ Add Wallet</button>
  </div>

  <!-- Donation Modal -->
  <div class="modal-overlay" id="donateModal">
    <div class="modal">
      <h3 data-i18n="launcher.donate">☕ Buy martins a coffee</h3>
      <p><span data-i18n="launcher.donateBody">Support development by sending NACKL to the address below. Click to copy.</span></p>
      <div class="copied" id="copiedText">✓ Copied to clipboard!</div>
      <div class="wallet-address" id="donateAddress" onclick="copyAddress()"></div>
      <button class="close-btn" onclick="hideDonate()" data-i18n="launcher.close">Close</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const { t, applyTranslations, buildLanguageSelect, seedLanguage } = require('./i18n');
    // Seed from the page's own URL, not an IPC call — same reasoning as the
    // wallet list just below: launcher.js already read settings.json once,
    // in the main process, before this page existed.
    try {
      seedLanguage(new URLSearchParams(window.location.search).get('initialLanguage'));
    } catch (e) { /* falls back to English inside i18n.js */ }

    window.addEventListener('error', (e) => {
      ipcRenderer.send('renderer-error', { source: 'index.html', message: e.message, stack: e.error?.stack });
    });
    window.addEventListener('unhandledrejection', (e) => {
      ipcRenderer.send('renderer-error', { source: 'index.html', message: String(e.reason?.message || e.reason), stack: e.reason?.stack });
    });

    const STORAGE_KEY = 'nacklepick_wallets';

    // Reported live: the launcher showed its empty state while localStorage
    // demonstrably held two wallets. Logging what was actually read — and
    // surviving a corrupt value instead of throwing — turns "my wallets are
    // gone" into something answerable from a log.
    /**
     * The wallet list arrives via the PAGE'S OWN URL, not an IPC call.
     *
     * Both localStorage and a synchronous IPC read of the file mirror were
     * tried here and both proved unreliable across this session:
     * localStorage's LevelDB store got its write-ahead log torn by repeated
     * forced process kills during testing, and could hand different windows
     * a different last-good value from the SAME key. The IPC-based file read
     * was meant to fix that — but reported live 2026-08-23: the SAME
     * wallets.json, same unchanged mtime, same correct content confirmed
     * moments before and after by a completely independent process, came
     * back "does not exist" for that one synchronous IPC call. Never
     * reproduced on demand, never explained.
     *
     * So the round trip is removed rather than debugged further: launcher.js
     * (createLauncher()) now reads wallets.json itself, once, in the main
     * process, BEFORE this page even exists to race it, and passes the
     * result in through the file:// URL's query string. There is no
     * “ask and wait for an answer” step left for anything to go wrong on.
     */
    let wallets = [];
    // Set when the main process could not read wallets.json at all. It is NOT
    // the same as "there are no wallets", and the difference matters twice
    // below: we must not overwrite the working copy with nothing, and the
    // screen must not offer the cheerful "add your first wallet" empty state
    // to someone whose two wallets are sitting intact on disk.
    let walletsUnreadable = false;
    try {
      const params = new URLSearchParams(window.location.search);
      walletsUnreadable = params.get('walletsUnreadable') === '1';
      const injected = params.get('initialWallets');
      wallets = injected ? JSON.parse(injected) : [];
      if (!Array.isArray(wallets)) wallets = [];
      console.log('[launcher] wallet list received from the page URL: ' + wallets.length +
        ' wallet(s) [' + wallets.map(function (w) { return w && w.name; }).join(', ') + ']' +
        (walletsUnreadable ? ' (READ FAILED — this empty list is not the truth)' : ''));

      if (walletsUnreadable) {
        // Fall back to the working copy instead of erasing it. Writing the
        // empty list through here is how one unreadable file turned into a
        // launcher with nothing in it AND a wiped localStorage — the read
        // failure propagating into the one other place the list still lived.
        const cached = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (Array.isArray(cached) && cached.length > 0) {
          wallets = cached;
          walletsUnreadable = false;
          console.warn('[launcher] wallets.json was unreadable, but localStorage still ' +
            'had ' + cached.length + ' wallet(s) — using those.');
        }
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(wallets));
      }
    } catch (e) {
      console.error('[launcher] wallet list could not be loaded — ' +
        'starting empty rather than crashing the launcher:', e.message);
      wallets = [];
    }

    /**
     * Mirror writes are COALESCED. Do not make this write on every call.
     *
     * `wallet-update` arrives on every miner status tick — roughly twice a
     * second with two wallets mining — and each one used to rewrite
     * wallets.json. With atomic writes that is a read, a full file copy to
     * .bak, a write, an fsync and a rename, twice a second, forever, on a
     * machine that mines all day. Three things wrong with that: pointless SSD
     * wear, a synchronous disk flush on the UI thread, and — the one that bit
     * us — the file is left permanently mid-write, which is the widest
     * possible window for a killed process to leave a stale or incoherent
     * view behind. Caught 2026-08-29: a read returned 280 characters from a
     * 272-byte file, which is not something a healthy read can do.
     *
     * The mirror is a safety net, not telemetry. Balances and tap counts do
     * not need to be durable to the millisecond; losing ten seconds of a
     * counter costs nothing, and the live values are on screen anyway.
     * Structural changes — adding, deleting, starting or stopping a wallet —
     * pass {immediate:true} because those are user intent and are rare.
     */
    const MIRROR_COALESCE_MS = 10000;
    let mirrorTimer = null;
    let lastMirrorJson = null;

    function writeMirrorNow() {
      const json = JSON.stringify(wallets);
      // Nothing changed since the last write — skip the disk entirely.
      if (json === lastMirrorJson) return;
      if (!Array.isArray(wallets) || wallets.length === 0) return;
      lastMirrorJson = json;
      ipcRenderer.invoke('wallets:writeMirror', wallets).catch(() => {});
    }

    function saveWallets(options) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(wallets));
      // Mirror to a plain file too. See the mirror's comment in launcher.js:
      // localStorage reads back EMPTY when the Chromium profile is locked or
      // replaced, which looks exactly like having no wallets.
      if (options && options.immediate) {
        if (mirrorTimer) { clearTimeout(mirrorTimer); mirrorTimer = null; }
        writeMirrorNow();
        return;
      }
      if (mirrorTimer) return;
      mirrorTimer = setTimeout(() => {
        mirrorTimer = null;
        writeMirrorNow();
      }, MIRROR_COALESCE_MS);
    }

    // Flush whatever is pending on the way out, so a clean close does not
    // discard the last few seconds of counters.
    window.addEventListener('beforeunload', () => {
      if (mirrorTimer) { clearTimeout(mirrorTimer); mirrorTimer = null; }
      writeMirrorNow();
    });

    /**
     * Restore from the file mirror when localStorage came up empty.
     *
     * Only ever ADDS wallets that are missing, and only when localStorage had
     * none -- an empty working copy alongside a populated mirror means the
     * profile did not load, not that the user deleted everything. Deliberate
     * deletion goes through deleteWallet(), which clears the mirror too.
     */
    async function restoreFromMirrorIfEmpty() {
      if (wallets.length > 0) return;
      try {
        const mirrored = await ipcRenderer.invoke('wallets:readMirror');
        if (!Array.isArray(mirrored) || mirrored.length === 0) return;
        wallets = mirrored;
        walletsUnreadable = false;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(wallets));
        console.warn('[launcher] localStorage held no wallets but the file mirror had ' +
          mirrored.length + ' — restored [' + mirrored.map(function (w) { return w && w.name; }).join(', ') +
          ']. This normally means the profile was locked by another copy of the app.');
        renderWallets();
      } catch (e) {
        console.warn('[launcher] Could not consult the wallet mirror:', e.message);
      }
    }

    /**
     * Re-read the mirror on demand, behind the "Try again" button.
     *
     * The failure this recovers from is transient — today's unreadable file
     * read back perfectly minutes later from another process — so a retry the
     * user can press is worth far more than another restart. The main-process
     * read already retries five times and falls back to wallets.json.bak
     * before it ever reports failure, so pressing this is a genuinely fresh
     * attempt rather than a repeat of the same one.
     */
    async function retryWalletRead() {
      try {
        const mirrored = await ipcRenderer.invoke('wallets:readMirror');
        if (Array.isArray(mirrored) && mirrored.length > 0) {
          wallets = mirrored;
          walletsUnreadable = false;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(wallets));
          console.warn('[launcher] Retry succeeded — recovered ' + mirrored.length +
            ' wallet(s). The earlier failure was a transient read, not lost data.');
        } else {
          console.warn('[launcher] Retry still could not read the wallet list.');
        }
      } catch (e) {
        console.warn('[launcher] Retry failed:', e.message);
      }
      renderWallets();
    }

    // Static markup first, then the picker. renderWallets() is re-run on
    // change because the wallet cards are built as HTML strings and so are not
    // reachable by applyTranslations()' data-i18n sweep.
    applyTranslations();
    buildLanguageSelect(document.getElementById('languageSelect'), () => {
      applyTranslations();
      renderWallets();
    });

    function renderWallets() {
      const list = document.getElementById('walletList');
      list.innerHTML = '';

      // "We could not read your wallets" and "you have no wallets" look
      // identical on screen unless we deliberately separate them, and showing
      // the wrong one is the whole reason a transient read failure read as
      // data loss. Left in English on purpose: this is a rare diagnostic
      // state where a mistranslated "your wallets are safe" would do real
      // harm, and the wording has to be exact.
      if (wallets.length === 0 && walletsUnreadable) {
        list.innerHTML = `
          <div style="text-align:center; color:#666; padding: 26px 14px;">
            <div style="font-size:2rem; margin-bottom:8px;">⚠️</div>
            <div style="font-size:0.95rem; color:#b45309; font-weight:600;">
              Couldn't read your wallet list
            </div>
            <div style="font-size:0.82rem; margin-top:8px; line-height:1.5;">
              This is a temporary problem reading the file — <strong>your wallets have
              not been deleted</strong> and nothing has been changed on disk.
              This usually follows an unexpected shutdown.
            </div>
            <button id="retryWalletRead" style="margin-top:14px; padding:8px 18px;
              font-size:0.85rem; cursor:pointer; border-radius:6px;
              border:1px solid #d1d5db; background:#fff;">Try again</button>
          </div>
        `;
        const retry = document.getElementById('retryWalletRead');
        if (retry) retry.onclick = retryWalletRead;
        return;
      }

      if (wallets.length === 0) {
        list.innerHTML = `
          <div style="text-align:center; color:#666; padding: 30px 10px;">
            <div style="font-size:2rem; margin-bottom:8px;">🐝</div>
            <div style="font-size:0.95rem;">${t('launcher.noWallets')}</div>
            <div style="font-size:0.8rem; margin-top:4px;">${t('launcher.addPrompt')}</div>
          </div>
        `;
        return;
      }

      wallets.forEach(wallet => {
        const card = document.createElement('div');
        card.className = 'wallet-card' + (wallet.isMining ? ' mining' : '');
        card.id = 'card-' + wallet.name;

        const statusText = wallet.isMining ? t('launcher.mining') : t('launcher.idle');
        const stopHidden = wallet.isMining ? '' : 'btn-hidden';

        // The miner window reports balance as an already-formatted NACKL
        // string ("12.5000", or "—" before it has been read). Older saved
        // wallets hold a plain number, so handle both — calling .toFixed()
        // on the string threw on every status update and aborted the whole
        // wallet list render.
        const balanceText = typeof wallet.balance === 'number'
          ? wallet.balance.toFixed(4)
          : (wallet.balance || '—');

        card.innerHTML = `
          <div class="wallet-info">
            <div class="wallet-name">
              <span class="avatar">👤</span>
              ${wallet.name}
            </div>
            <div class="wallet-status">
              <span class="status-dot ${wallet.isMining ? 'mining' : ''}"></span>
              ${statusText}
            </div>
            <div class="wallet-stats">
              <div>Sessions: <span>${wallet.sessions}</span></div>
              <div>Taps: <span>${wallet.taps}</span></div>
              <div class="wallet-balance">${balanceText} NACKL</div>
            </div>
          </div>
          <div class="wallet-actions">
            <button class="btn btn-launch" onclick="launchWallet('${wallet.name}')">⛏️ Launch</button>
            <button class="btn btn-stop ${stopHidden}" id="stop-${wallet.name}" onclick="stopWallet('${wallet.name}')">⏹ Stop</button>
            <button class="btn btn-delete" onclick="deleteWallet('${wallet.name}')">🗑️</button>
          </div>
        `;
        list.appendChild(card);
      });
      console.log('[launcher] rendered ' + list.children.length + ' wallet card(s); ' +
        'walletList found=' + !!list + ' visible=' + (list.offsetParent !== null) +
        ' clientHeight=' + list.clientHeight);
    }

    function launchWallet(name) {
      ipcRenderer.send('open-miner', name);
    }

    function stopWallet(name) {
      ipcRenderer.send('stop-miner', name);
      // Optimistically update UI
      const w = wallets.find(w => w.name === name);
      if (w) {
        w.isMining = false;
        saveWallets({ immediate: true });
        renderWallets();
      }
    }

    function deleteWallet(name) {
      if (!confirm(`Delete wallet "${name}"? This cannot be undone.`)) return;
      wallets = wallets.filter(w => w.name !== name);
      // An explicit deletion is the one case where an empty list is genuine.
      if (wallets.length === 0) ipcRenderer.invoke('wallets:clearMirror').catch(() => {});
      saveWallets({ immediate: true });
      renderWallets();
    }

    function addWallet() {
      const input = document.getElementById('newWalletName');
      const name = input.value.trim().toLowerCase();
      if (!name) return;
      if (wallets.find(w => w.name === name)) {
        alert('Wallet name already exists');
        return;
      }
      wallets.push({ name, sessions: 0, taps: 0, balance: 0, isMining: false, history: [] });
      saveWallets({ immediate: true });
      input.value = '';
      renderWallets();
    }

    // Receive live updates from miner windows
    ipcRenderer.on('wallet-update', (event, data) => {
      const { wallet, isMining, taps, sessions, balance } = data;
      const w = wallets.find(w => w.name === wallet);
      if (w) {
        w.isMining = isMining;
        w.taps = taps;
        w.sessions = sessions;
        w.balance = balance;
        saveWallets();
        renderWallets();
      }
    });

    // Donation modal
    function showDonate() {
      document.getElementById('donateModal').classList.add('show');
    }
    function hideDonate() {
      document.getElementById('donateModal').classList.remove('show');
      document.getElementById('copiedText').classList.remove('show');
    }
    // Restored on instruction. NOTE: this is a real personal address and it
    // ships to everyone who installs the app — that is the intent here, but it
    // is the reason the constant exists rather than the value being inlined in
    // three places. Set it to '' to hide the donate button entirely.
    const DONATION_ADDRESS = 'martins';   // Acki Nacki wallet NAME, not a 0:… address

    (function applyDonationVisibility() {
      const btn = document.getElementById('donateBtn');
      const addrEl = document.getElementById('donateAddress');
      if (!DONATION_ADDRESS) return;            // stays hidden
      if (btn) btn.style.display = '';
      if (addrEl) addrEl.textContent = DONATION_ADDRESS;
    })();

    function copyAddress() {
      const addr = DONATION_ADDRESS;
      if (!addr) return;
      navigator.clipboard.writeText(addr).then(() => {
        document.getElementById('copiedText').classList.add('show');
        setTimeout(() => document.getElementById('copiedText').classList.remove('show'), 2000);
      });
    }

    // Close modal on overlay click
    document.getElementById('donateModal').addEventListener('click', (e) => {
      if (e.target.id === 'donateModal') hideDonate();
    });

    // Enter key to add wallet
    document.getElementById('newWalletName').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addWallet();
    });

    // Initial render
    renderWallets();
    // Keep the mirror current with whatever was actually loaded (a no-op
    // when it was the source in the first place).
    if (wallets.length > 0) {
      ipcRenderer.invoke('wallets:writeMirror', wallets).catch(() => {});
    } else {
      // Last line of defence, and it was never actually wired up: this was
      // defined but never called, so the "localStorage came up empty but the
      // mirror has entries" recovery had never once run in practice. It is
      // the exact case the mirror exists for, so call it.
